<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Сердце для тебя 💖</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        body {
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            font-family: Arial, sans-serif;
            overflow: hidden;
            position: fixed;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 75vh;
        }
        h1 {
            margin-top: 10px;
            font-size: 26px;
            text-align: center;
            padding: 0 20px;
            color: #ff4d6d;
            opacity: 0;
            animation: fadeIn 2s ease 6s forwards;
        }
        @keyframes fadeIn {
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <canvas id="heart"></canvas>
    <h1>Это сердце для тебя 💖</h1>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        const canvas = document.getElementById('heart');
        const ctx = canvas.getContext('2d');

        // Устанавливаем физический размер canvas с учётом DPI
        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
        }
        resizeCanvas();

        // Рабочие размеры (в CSS-пикселях)
        const W = canvas.getBoundingClientRect().width;
        const H = canvas.getBoundingClientRect().height;

        // Отступы от краёв (чтобы сердце не вылезало)
        const paddingX = W * 0.08;   // 8% от ширины
        const paddingTop = H * 0.05;  // 5% сверху
        const paddingBottom = H * 0.08; // 8% снизу (место для текста)

        const availableW = W - paddingX * 2;
        const availableH = H - paddingTop - paddingBottom;

        // Сердце по формуле: ширина ~32, высота ~30 (примерно 1:1)
        // Максимальный scale = 16, значит максимальный размер = 32 * 16 = 512 единиц
        // Подбираем множитель так, чтобы сердце влезло
        const heartMaxSize = 32 * 16;
        const fitScale = Math.min(availableW, availableH) / heartMaxSize;

        const centerX = W / 2;
        const centerY = paddingTop + availableH / 2;

        const texts = [];
        const color = '#ff2d55'; // насыщенный красный

        // Генерируем все точки сердца
        for (let s = 11; s < 17; s++) {
            for (let i = 0; i < 120; i++) {
                const t = (i * 2 * Math.PI) / 120;
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) 
                          - 2 * Math.cos(3 * t) - Math.cos(4 * t);
                
                texts.push({
                    x: x * s * fitScale + centerX,
                    y: -y * s * fitScale + centerY,
                    opacity: 0,
                    targetOpacity: 0.4 + Math.random() * 0.5
                });
            }
        }

        let currentIndex = 0;
        const fontSize = Math.max(9, fitScale * 14);
        let animationId;

        function animate() {
            // Полная очистка (без шлейфа — чтобы текст не сливался)
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, W, H);
            
            for (let i = 0; i <= currentIndex && i < texts.length; i++) {
                const text = texts[i];
                
                if (text.opacity < text.targetOpacity) {
                    text.opacity += 0.08;
                }
                
                ctx.globalAlpha = text.opacity;
                ctx.fillStyle = color;
                ctx.font = `bold ${fontSize}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('I love you', text.x, text.y);
            }
            
            ctx.globalAlpha = 1;
            
            if (currentIndex < texts.length - 1) {
                currentIndex++;
                animationId = requestAnimationFrame(animate);
            }
        }

        animate();

        window.addEventListener('beforeunload', () => {
            if (animationId) cancelAnimationFrame(animationId);
        });
    </script>
</body>
</html>
