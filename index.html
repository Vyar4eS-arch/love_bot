<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Сердце для тебя 💖</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        color: #ffb6c1;
        overflow: hidden;
      }
      canvas {
        max-width: 100%;
        max-height: 70vh;
      }
      h1 {
        margin-top: 20px;
        font-size: 24px;
        opacity: 0;
        animation: fadeIn 2s ease 8s forwards;
      }
      @keyframes fadeIn {
        to {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="heart"></canvas>
    <h1>Это сердце для тебя 💖</h1>

    <script>
      // Инициализация Telegram Web App
      const tg = window.Telegram.WebApp;
      tg.expand(); // Разворачиваем на весь экран
      tg.ready();

      const canvas = document.getElementById("heart");
      const ctx = canvas.getContext("2d");

      // Размер canvas
      const size = Math.min(window.innerWidth, window.innerHeight * 0.7);
      canvas.width = size;
      canvas.height = size;

      // Параметры сердца
      const centerX = size / 2;
      const centerY = size / 2;
      const maxScale = 16;
      const pointsPerScale = 120;
      const totalFrames = (maxScale - 11) * pointsPerScale; // 6 * 120 = 720

      let frame = 0;
      const fontSize = Math.max(8, size / 60);

      function drawHeart() {
        if (frame >= totalFrames) return;

        const scaleIndex = Math.floor(frame / pointsPerScale) + 11;
        const pointIndex = frame % pointsPerScale;

        const t = (pointIndex * (2 * Math.PI)) / pointsPerScale;
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y =
          13 * Math.cos(t) -
          5 * Math.cos(2 * t) -
          2 * Math.cos(3 * t) -
          Math.cos(4 * t);

        const px = centerX + x * scaleIndex * (size / 200);
        const py = centerY - y * scaleIndex * (size / 200);

        ctx.fillStyle = "#ffb6c1";
        ctx.font = `bold ${fontSize}px Arial`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("I love you", px, py);

        frame++;
        requestAnimationFrame(drawHeart);
      }

      // Запускаем анимацию
      drawHeart();
    </script>
  </body>
</html>
