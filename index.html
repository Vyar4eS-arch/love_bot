<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Сердце для тебя 💖</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        body {
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            width: 100vw;
            font-family: Arial, sans-serif;
            color: #ffb6c1;
            overflow: hidden;
            position: fixed;
        }
        canvas {
            display: block;
            margin-top: 20px;
        }
        h1 {
            margin-top: 15px;
            font-size: 24px;
            text-align: center;
            padding: 0 20px;
            opacity: 0;
            animation: fadeIn 2s ease 8s forwards;
        }
        @keyframes fadeIn {
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <canvas id="heart"></canvas>
    <h1>Это сердце для тебя 💖</h1>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        const canvas = document.getElementById('heart');
        const ctx = canvas.getContext('2d');

        // Устанавливаем размер canvas
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight * 0.65;
        }
        resizeCanvas();

        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2 - 30; // Сдвигаем выше
        const scaleFactor = Math.min(canvas.width / 250, canvas.height / 300);
        
        let animationId;
        const texts = [];
        
        // Генерируем все точки сердца заранее
        for (let s = 11; s < 17; s++) {
            for (let i = 0; i < 120; i++) {
                const t = (i * 2 * Math.PI) / 120;
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) 
                          - 2 * Math.cos(3 * t) - Math.cos(4 * t);
                
                texts.push({
                    x: centerX + x * s * scaleFactor,
                    y: centerY - y * s * scaleFactor, // Инвертируем Y для правильного отображения
                    opacity: 0,
                    targetOpacity: 0.4 + Math.random() * 0.3
                });
            }
        }

        let currentIndex = 0;
        const fontSize = Math.max(9, scaleFactor * 12);
        
        function animate() {
            // Очищаем canvas
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Рисуем уже появившиеся тексты
            for (let i = 0; i < texts.length; i++) {
                const text = texts[i];
                
                if (i <= currentIndex) {
                    // Плавное появление
                    if (text.opacity < text.targetOpacity) {
                        text.opacity += 0.03;
                    }
                    
                    ctx.globalAlpha = text.opacity;
                    ctx.fillStyle = '#ffb6c1';
                    ctx.font = `bold ${fontSize}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('I love you', text.x, text.y);
                }
            }
            
            ctx.globalAlpha = 1;
            
            // Переходим к следующей точке
            if (currentIndex < texts.length - 1) {
                currentIndex++;
                animationId = requestAnimationFrame(animate);
            }
        }

        // Запускаем анимацию
        animate();

        // Очистка при закрытии
        window.addEventListener('beforeunload', () => {
            if (animationId) {
                cancelAnimationFrame(animationId);
            }
        });
    </script>
</body>
</html>
